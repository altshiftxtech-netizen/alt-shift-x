<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/6a19363c90f06323c4cfff73/d476ae1cb_altxlogo2.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Alt+Shift+X Market — AI Components for Construction Intelligence</title>

    <!-- SEO: Dynamic robot control per page -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Standard SEO Tags -->
    <meta name="description" content="Discover verified AI-powered components for construction intelligence, risk analysis, project management, and site reporting. Trusted by enterprises." />
    <meta name="keywords" content="AI components, construction, risk management, project management, site reporting, verified components, enterprise software" />
    <meta name="author" content="Alt+Shift+X" />
    <meta name="theme-color" content="#5b21b6" />

    <!-- Open Graph: Complete social sharing -->
    <meta property="og:title" content="Alt+Shift+X Market — Verified AI Components for Construction" />
    <meta property="og:description" content="Discover verified AI-powered components for construction intelligence, risk analysis, and enterprise project management." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://media.base44.com/images/public/6a19363c90f06323c4cfff73/031f54965_altxlogo2.jpg" />
    <meta property="og:image:alt" content="Alt+Shift+X Market Logo" />
    <meta property="og:url" content="https://altshiftx.com" />
    <meta property="og:site_name" content="Alt+Shift+X Market" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alt+Shift+X Market" />
    <meta name="twitter:description" content="Verified AI components for construction intelligence." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/6a19363c90f06323c4cfff73/031f54965_altxlogo2.jpg" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://altshiftx.com" />

    <!-- Structured Data: Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Alt+Shift+X",
      "url": "https://altshiftx.com",
      "logo": "https://media.base44.com/images/public/6a19363c90f06323c4cfff73/031f54965_altxlogo2.jpg",
      "description": "Verified AI-powered components for construction intelligence",
      "sameAs": [
        "https://twitter.com/altshiftx",
        "https://linkedin.com/company/altshiftx"
      ]
    }
    </script>

    <!-- Prevent right-click save / drag on images globally -->
    <style>
      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }
      /* Re-enable pointer events on interactive images wrapped in links */
      a img, button img {
        pointer-events: auto;
      }
    </style>

    <script>
      // Block right-click context menu globally
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
      // Block common keyboard shortcuts for saving/copying page content
      document.addEventListener('keydown', function(e) {
        // Block Ctrl+S, Ctrl+U (view source), Ctrl+Shift+I (devtools), F12
        if (
          (e.ctrlKey && (e.key === 's' || e.key === 'u')) ||
          (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) ||
          e.key === 'F12'
        ) {
          e.preventDefault();
          return false;
        }
      });
      // Block drag-and-drop of images
      document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG') {
          e.preventDefault();
          return false;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
